services:
  awork-middleware:
    build: .
    ports:
      - "3500:3500"
    environment:
      - AWORK_API_TOKEN=${AWORK_API_TOKEN}
      - AWORK_BASE_URL=${AWORK_BASE_URL:-https://api.awork.com/api/v1}
      - AWORK_WORKSPACE_URL=${AWORK_WORKSPACE_URL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - API_KEY=${API_KEY}
      - PORT=3500
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_NAME=${ADMIN_NAME:-}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:-}
    volumes:
      # Ownership regelt der Entrypoint selbst (chown auf uid 1000, dann su-exec)
      - ./data:/app/data
    restart: unless-stopped

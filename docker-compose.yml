services:
  awork-middleware:
    build: .
    ports:
      - "3500:3500"
    environment:
      - AWORK_API_TOKEN=${AWORK_API_TOKEN}
      - AWORK_BASE_URL=${AWORK_BASE_URL:-https://api.awork.com/api/v1}
      - AWORK_WORKSPACE_URL=${AWORK_WORKSPACE_URL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - API_KEY=${API_KEY}
      - PORT=3500
    volumes:
      # Container läuft als node (uid 1000) – ./data muss uid 1000 gehören:
      #   mkdir -p data && chown 1000:1000 data
      - ./data:/app/data
    restart: unless-stopped

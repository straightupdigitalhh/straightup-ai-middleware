services:
  awork-middleware:
    image: ghcr.io/straightupdigitalhh/straightup-ai-middleware:latest
    ports:
      - "3500:3500/tcp"
    environment:
      AWORK_API_TOKEN: ${AWORK_API_TOKEN}
      AWORK_BASE_URL: ${AWORK_BASE_URL:-https://api.awork.com/api/v1}
      AWORK_WORKSPACE_URL: ${AWORK_WORKSPACE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      API_KEY: ${API_KEY}
      PORT: "3500"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      MS_TENANT_ID: ${MS_TENANT_ID:-}
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
      MS_MAILBOXES: ${MS_MAILBOXES:-}
      MS_USER_EMAIL: ${MS_USER_EMAIL:-}
      MS_SENDER_EMAIL: ${MS_SENDER_EMAIL:-}
    volumes:
      # Ownership regelt der Entrypoint selbst (chown auf uid 1000, dann su-exec)
      - ./data:/app/data
